<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="pastaGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="pastaInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Decorative Plate / Board -->
  <ellipse cx="200" cy="190" rx="150" ry="60" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="4"/>
  <ellipse cx="200" cy="188" rx="135" ry="50" fill="#FFFFFF"/>

  <!-- Rigatoni Pasta Tube 1 -->
  <g transform="translate(130, 110) rotate(-25)">
    <rect x="0" y="0" width="38" height="85" rx="6" fill="url(#pastaGrad)"/>
    <ellipse cx="19" cy="0" rx="19" ry="8" fill="url(#pastaInner)"/>
    <ellipse cx="19" cy="85" rx="19" ry="8" fill="url(#pastaGrad)"/>
    <!-- Ribs/Ridges -->
    <line x1="8" y1="5" x2="8" y2="85" stroke="#FDE68A" stroke-width="2" opacity="0.6"/>
    <line x1="19" y1="8" x2="19" y2="88" stroke="#FDE68A" stroke-width="2.5" opacity="0.8"/>
    <line x1="30" y1="5" x2="30" y2="85" stroke="#FDE68A" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Rigatoni Pasta Tube 2 -->
  <g transform="translate(195, 125) rotate(15)">
    <rect x="0" y="0" width="40" height="90" rx="6" fill="url(#pastaGrad)"/>
    <ellipse cx="20" cy="0" rx="20" ry="9" fill="url(#pastaInner)"/>
    <ellipse cx="20" cy="90" rx="20" ry="9" fill="url(#pastaGrad)"/>
    <line x1="9" y1="5" x2="9" y2="90" stroke="#FDE68A" stroke-width="2" opacity="0.6"/>
    <line x1="20" y1="9" x2="20" y2="93" stroke="#FDE68A" stroke-width="2.5" opacity="0.8"/>
    <line x1="31" y1="5" x2="31" y2="90" stroke="#FDE68A" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Rigatoni Pasta Tube 3 (Lying flat) -->
  <g transform="translate(160, 185) rotate(65)">
    <rect x="0" y="0" width="36" height="80" rx="6" fill="url(#pastaGrad)"/>
    <ellipse cx="18" cy="0" rx="18" ry="7" fill="url(#pastaInner)"/>
    <ellipse cx="18" cy="80" rx="18" ry="7" fill="url(#pastaGrad)"/>
    <line x1="18" y1="7" x2="18" y2="82" stroke="#FDE68A" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Basil Garnish Leaf -->
  <path d="M220 135 C235 110, 260 115, 255 135 C250 155, 230 150, 220 135 Z" fill="#10B981"/>
  <path d="M220 135 Q240 130 255 135" stroke="#047857" stroke-width="1.5" fill="none"/>

  <!-- Badge label -->
  <rect x="110" y="240" width="180" height="32" rx="16" fill="#1E293B" opacity="0.9"/>
  <text x="200" y="261" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Durum Wheat Rigatoni</text>
</svg>
