<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNuts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="cashewGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="60%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="almondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="70%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgNuts)"/>

  <!-- Wooden Bowl Base Shadow -->
  <ellipse cx="200" cy="225" rx="140" ry="25" fill="#C2410C" opacity="0.3"/>

  <!-- Wooden Bowl -->
  <path d="M70 140 C70 230, 330 230, 330 140 Z" fill="url(#bowlGrad)"/>
  <ellipse cx="200" cy="140" rx="130" ry="35" fill="#7C2D12"/>

  <!-- Almond 1 -->
  <path d="M140 140 C120 120, 140 90, 165 110 C180 125, 170 155, 140 140 Z" fill="url(#almondGrad)"/>
  <!-- Almond 2 -->
  <path d="M220 145 C205 120, 230 95, 255 115 C270 130, 250 160, 220 145 Z" fill="url(#almondGrad)"/>

  <!-- Cashew Nut 1 (Curved kidney shape) -->
  <path d="M165 125 C150 95, 200 80, 215 105 C225 120, 205 140, 185 130 C175 125, 170 135, 165 125 Z" fill="url(#cashewGrad)" stroke="#B45309" stroke-width="1.5"/>
  <!-- Cashew Nut 2 -->
  <path d="M190 120 C185 85, 240 85, 245 115 C248 135, 220 140, 205 128 Z" fill="url(#cashewGrad)" stroke="#B45309" stroke-width="1.5"/>
  <!-- Cashew Nut 3 (Foreground) -->
  <path d="M170 145 C155 125, 195 115, 210 130 C220 145, 195 165, 180 155 Z" fill="url(#cashewGrad)" stroke="#B45309" stroke-width="1.5"/>

  <!-- Salt Crystal sparkles -->
  <circle cx="160" cy="115" r="2.5" fill="#FFFFFF"/>
  <circle cx="195" cy="110" r="3" fill="#FFFFFF"/>
  <circle cx="230" cy="130" r="2.5" fill="#FFFFFF"/>
  <circle cx="180" cy="140" r="2" fill="#FFFFFF"/>

  <!-- Badge label -->
  <rect x="100" y="240" width="200" height="32" rx="16" fill="#1E293B" opacity="0.9"/>
  <text x="200" y="261" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Roasted Cashews &amp; Almonds</text>
</svg>
