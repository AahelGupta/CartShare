<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="bluePen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="redPen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="purplePen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="greenPen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgPens)"/>

  <!-- Notepad Paper Surface in Background -->
  <rect x="80" y="40" width="240" height="200" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Notebook lines -->
  <line x1="100" y1="75" x2="300" y2="75" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="100" y1="105" x2="300" y2="105" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="100" y1="135" x2="300" y2="135" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="100" y1="165" x2="300" y2="165" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="100" y1="195" x2="300" y2="195" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Red margin line -->
  <line x1="130" y1="40" x2="130" y2="240" stroke="#FCA5A5" stroke-width="2"/>

  <!-- Pen 1: Blue Pen -->
  <g transform="translate(150, 45) rotate(28)">
    <rect x="0" y="20" width="16" height="150" rx="4" fill="url(#bluePen)"/>
    <polygon points="0,20 16,20 8,0" fill="#CBD5E1"/>
    <circle cx="8" cy="2" r="1.5" fill="#1E293B"/> <!-- Rollerball tip -->
    <rect x="-2" y="140" width="20" height="25" rx="3" fill="#1E293B"/> <!-- Pen Cap / Grip -->
    <rect x="2" y="70" width="12" height="40" rx="2" fill="#FFFFFF" opacity="0.4"/> <!-- Clear ink window -->
    <!-- Clip -->
    <path d="M-2 145 L-6 145 L-6 110 L-2 110" stroke="#94A3B8" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Pen 2: Red Pen -->
  <g transform="translate(190, 55) rotate(22)">
    <rect x="0" y="20" width="16" height="150" rx="4" fill="url(#redPen)"/>
    <polygon points="0,20 16,20 8,0" fill="#CBD5E1"/>
    <circle cx="8" cy="2" r="1.5" fill="#1E293B"/>
    <rect x="-2" y="140" width="20" height="25" rx="3" fill="#1E293B"/>
    <rect x="2" y="70" width="12" height="40" rx="2" fill="#FFFFFF" opacity="0.4"/>
    <path d="M-2 145 L-6 145 L-6 110 L-2 110" stroke="#94A3B8" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Pen 3: Green Pen -->
  <g transform="translate(230, 68) rotate(16)">
    <rect x="0" y="20" width="16" height="150" rx="4" fill="url(#greenPen)"/>
    <polygon points="0,20 16,20 8,0" fill="#CBD5E1"/>
    <circle cx="8" cy="2" r="1.5" fill="#1E293B"/>
    <rect x="-2" y="140" width="20" height="25" rx="3" fill="#1E293B"/>
    <rect x="2" y="70" width="12" height="40" rx="2" fill="#FFFFFF" opacity="0.4"/>
    <path d="M-2 145 L-6 145 L-6 110 L-2 110" stroke="#94A3B8" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Pen 4: Purple Pen -->
  <g transform="translate(265, 80) rotate(10)">
    <rect x="0" y="20" width="16" height="150" rx="4" fill="url(#purplePen)"/>
    <polygon points="0,20 16,20 8,0" fill="#CBD5E1"/>
    <circle cx="8" cy="2" r="1.5" fill="#1E293B"/>
    <rect x="-2" y="140" width="20" height="25" rx="3" fill="#1E293B"/>
    <rect x="2" y="70" width="12" height="40" rx="2" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- Ink doodles / test lines on paper -->
  <path d="M140 180 Q150 170 160 180 T180 180" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M140 195 Q150 185 160 195 T180 195" stroke="#DC2626" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Badge label -->
  <rect x="100" y="245" width="200" height="32" rx="16" fill="#1E293B" opacity="0.9"/>
  <text x="200" y="266" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Gel Ink Rollerball Pens</text>
</svg>
